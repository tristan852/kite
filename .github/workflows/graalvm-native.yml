name: Build Native Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build native image on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM with Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Verify GraalVM setup
        run: |
          java --version
          native-image --version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build native executable
        run: ./gradlew clean nativeCompile

      - name: List binaries
        run: ls -R build/native/nativeCompile/

      # Package Linux and macOS into tar.gz, Windows into zip
      - name: Package binaries
        shell: bash
        run: |
          VERSION=1.16.1
          OS=${{ matrix.os }}
          BIN_DIR=build/native/nativeCompile

          case "$OS" in
            windows-latest)
              ARCHIVE=kite-$VERSION-windows-x64.zip
              cd "$BIN_DIR"
              7z a "$GITHUB_WORKSPACE/$ARCHIVE" *
              cd -
              ;;
            ubuntu-latest)
              ARCHIVE=kite-$VERSION-linux-x64.tar.gz
              tar -czf "$ARCHIVE" -C "$BIN_DIR" .
              ;;
            macos-latest)
              ARCHIVE=kite-$VERSION-macos-x64.tar.gz
              tar -czf "$ARCHIVE" -C "$BIN_DIR" .
              ;;
          esac

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: kite-${{ matrix.os }}
          path: ${{ env.ARCHIVE }}
