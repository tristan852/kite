name: Build Native Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build native image on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM with Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Verify GraalVM setup
        run: |
          java --version
          native-image --version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build native executable
        run: ./gradlew clean nativeCompile

      - name: List binaries
        run: ls -R build/native/nativeCompile/

      # Test native executable with script file
      - name: Test native executable with script
        shell: bash
        run: |
          # Determine executable path based on OS
          OS=${{ matrix.os }}
          BIN_DIR=build/native/nativeCompile
          case "$OS" in
            windows-latest)
              EXECUTABLE="$BIN_DIR/kite.exe"
              ;;
            *)
              EXECUTABLE="$BIN_DIR/kite"
              ;;
          esac

          # Make sure executable is runnable
          chmod +x "$EXECUTABLE" || true

          # Define the script file path
          SCRIPT_FILE=assets/cli/test/test_script.txt

          # Fail if the script file does not exist
          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "Error: Script file '$SCRIPT_FILE' not found."
            exit 2
          fi

          # Run CLI and capture output
          "$EXECUTABLE" --script "$SCRIPT_FILE" --quiet --plain > test_script_output.txt 2>&1
          EXIT_CODE=$?

          # Check exit code
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error: CLI exited with code $EXIT_CODE."
            exit $EXIT_CODE
          fi

          # Normalize line endings (CRLF -> LF)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's/\r$//' test_script_output.txt
          else
            sed -i 's/\r$//' test_script_output.txt
          fi

          # Force UTF-8 without BOM
          iconv -f UTF-8 -t UTF-8 -c test_script_output.txt > temporary.txt
          mv temporary.txt test_script_output.txt

          # Compare exact contents
          diff -u assets/cli/test/expected_test_script_output.txt test_script_output.txt
          if [ $? -ne 0 ]; then
            echo "Error: CLI output does not match expected output!"
            exit 1
          fi

      # Package Linux and macOS into tar.gz, Windows into zip
      - name: Package binaries
        shell: bash
        run: |
          VERSION=1.19.2
          OS=${{ matrix.os }}
          BIN_DIR=build/native/nativeCompile

          case "$OS" in
            windows-latest)
              ARCHIVE=kite-$VERSION-windows-x64.zip
              cd "$BIN_DIR"
              7z a "$GITHUB_WORKSPACE/$ARCHIVE" *
              cd -
              ;;
            ubuntu-latest)
              ARCHIVE=kite-$VERSION-linux-x64.tar.gz
              tar -czf "$ARCHIVE" -C "$BIN_DIR" .
              ;;
            macos-latest)
              ARCHIVE=kite-$VERSION-macos-x64.tar.gz
              tar -czf "$ARCHIVE" -C "$BIN_DIR" .
              ;;
          esac

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: kite-${{ matrix.os }}
          path: ${{ env.ARCHIVE }}
